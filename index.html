<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta para Meu Amor</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6f2;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/s2/Imagens/nos.jpeg') no-repeat center center/cover;
            transition: filter 0.5s ease;
            z-index: -1;
        }

        .blur {
            filter: blur(8px);
        }

        .envelope {
            position: relative;
            width: 200px;
            height: 150px;
            background-color: #ff4d79;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.5s;
            z-index: 1;
        }

        .envelope:hover {
            transform: scale(1.1);
        }

        .flap {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 80px solid #ff4d79;
            transform-origin: top;
            transition: transform 0.5s;
        }

        .letter {
            position: absolute;
            width: 250px;
            height: 150px;
            background-color: white;
            border-radius: 5px;
            display: flex;
            align-items: center;
            padding: 10px;
            transform: translateY(50px);
            opacity: 0;
            transition: transform 0.5s, opacity 0.5s;
            z-index: 2;
        }

        .letter img {
            width: 40%;
            height: auto;
            border-radius: 5px;
            margin-right: 10px;
        }

        .letter-content {
            width: 60%;
            text-align: left;
        }

        .heart {
            font-size: 24px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="background-container" id="background"></div>
    
    <div class="envelope" onclick="openLetter()">
        <div class="flap" id="flap"></div>
        <span class="heart">❤</span>
        <div class="letter" id="letter">
            <img src="/s2/Imagens/dedinhos.jpeg" alt="Nossa Foto">
            <div class="letter-content">
                <h3>Para Meu Amor ❤️</h3>
                <p>Você é a pessoa mais especial do mundo para mim! Te amo demais! 💕</p>
            </div>
        </div>
    </div>

    <script>
        function openLetter() {
            document.getElementById("flap").style.transform = "rotateX(180deg)";
            document.getElementById("letter").style.transform = "translateY(-20px)";
            document.getElementById("letter").style.opacity = "1";
            document.getElementById("background").classList.add("blur");
        }
    </script>
</body>
</html>
